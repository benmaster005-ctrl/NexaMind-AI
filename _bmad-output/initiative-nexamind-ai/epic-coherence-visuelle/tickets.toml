# tickets.toml — Epic 7: Cohérence Visuelle & Refonte UX

[[entry]]
id = 1
type = "story"
title = "Socle visuel : tokens CSS, thème sombre complet, primitives partagées et shell épuré"
description = """
Faire des tokens de DESIGN.md la source unique des styles (variables CSS clair/sombre),
généraliser le thème sombre aux écrans qui l'ignorent, extraire les primitives
partagées (bouton, carte, état vide, icône SVG) et les appliquer au shell de
navigation et au tableau de bord, avec des icônes sobres à la place des emoji.
"""
covers = []
prerequisites = "Tous les écrans du MVP livrés (epics 1 à 6)"
acceptance_criteria = """
- Les couleurs, rayons et espacements viennent de variables CSS définies une seule fois à partir de DESIGN.md ; plus aucune valeur hexadécimale de charte recopiée dans un composant.
- Le thème sombre s'applique à tous les écrans, y compris les quatre qui l'ignoraient (fiche document, tiroir de résumé, historique, liste des recherches).
- La navigation et le tableau de bord utilisent les primitives partagées et des icônes SVG sobres (aucun emoji).
- La hiérarchie typographique et l'échelle d'espacement du tableau de bord respectent DESIGN.md (§3 et §4).
- Aucune régression fonctionnelle : les 19 suites de tests, la validation MVP (56/56) et la validation chat (14/14) restent vertes.
- Aucun style inline ne contourne les CSS modules dans les composants du shell.
"""
edge_cases_and_errors = """
- Contraste : les couples texte/fond doivent rester lisibles en clair comme en sombre (vérification manuelle sur les titres, métadonnées et boutons).
- Navigation : le libellé et l'état actif restent accessibles (aria-current, cible tactile 44px) après remplacement des icônes.
"""
